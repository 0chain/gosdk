name: Build WASM (standard + enterprise)

# Builds BOTH wasm variants in one run:
#   - standard   -> zcn.wasm            (built from `standard_ref`)
#   - enterprise -> enterprise-zcn.wasm (built from `enterprise_ref`)
# Standard vs enterprise differ by branch/code today (wasmsdk getWasmType()),
# so we check out each ref and run `make wasm-build` against it.
#
# Publishing: each variant attaches to its OWN GitHub Release tag (standard and
# enterprise are separate releases — e.g. v1.20.10-standard vs v1.20.10-enterprise;
# the "lfb" releases are the standard build). Same upload mechanism the
# iOS/Android/macOS SDKs use in build-sdks.yml. The runner box then downloads by
# tag, e.g.:
#   curl -L -o enterprise-zcn.wasm \
#     https://github.com/0chain/gosdk/releases/download/v1.20.10-enterprise/enterprise-zcn.wasm
# and drops them into the blimp deploy's public/ with USE_LOCAL_WASM=true.
# blimp ships both: zcn.wasm for standard allocations, enterprise-zcn.wasm for
# enterprise allocations.

on:
  workflow_dispatch:
    inputs:
      standard_ref:
        description: 'Branch/tag for the STANDARD wasm'
        required: true
        default: 'staging'
      enterprise_ref:
        description: 'Branch/tag for the ENTERPRISE wasm'
        required: true
        default: 'feat/enterprise-blobber'
      standard_release_tag:
        description: 'Release tag for the STANDARD wasm (e.g. v1.20.10-standard). Blank = artifact only.'
        required: false
        default: ''
      enterprise_release_tag:
        description: 'Release tag for the ENTERPRISE wasm (e.g. v1.20.10-enterprise). Blank = artifact only.'
        required: false
        default: ''

jobs:
  build-wasm:
    name: build-wasm (${{ matrix.variant }})
    runs-on: [self-hosted, arc-runner]
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            ref: ${{ github.event.inputs.standard_ref }}
            out: zcn.wasm
            tag: ${{ github.event.inputs.standard_release_tag }}
          - variant: enterprise
            ref: ${{ github.event.inputs.enterprise_ref }}
            out: enterprise-zcn.wasm
            tag: ${{ github.event.inputs.enterprise_release_tag }}
    steps:
      - name: Set up Go 1.22
        uses: actions/setup-go@v3
        with:
          go-version: 1.22.5

      - name: Checkout ${{ matrix.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential nghttp2 libnghttp2-dev libssl-dev wget

      - name: Build wasm (${{ matrix.variant }})
        run: |
          docker run --rm -v "$PWD":/gosdk -w /gosdk golang:1.22.5 make wasm-build
          if [ "${{ matrix.out }}" != "zcn.wasm" ]; then mv zcn.wasm "${{ matrix.out }}"; fi
          echo "built ${{ matrix.variant }} -> ${{ matrix.out }}"
          ls -la "${{ matrix.out }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}

      - name: Attach to GitHub Release (${{ matrix.variant }})
        if: ${{ matrix.tag != '' }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ matrix.out }}
          asset_name: ${{ matrix.out }}
          tag: ${{ matrix.tag }}
          overwrite: true
